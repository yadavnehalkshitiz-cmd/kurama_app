name: kurama_mobile
description: Kurama App — privacy-focused multi-platform media downloader.
publish_to: 'none'
version: 1.3.0+5

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.1
  provider: ^6.1.2
  path_provider: ^2.1.2
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  share_plus: ^10.0.0
  # 1.9.0 requires the preview Android API 37; keep production builds on API 36.
  receive_sharing_intent: 1.8.1
  flutter_inappwebview: ^6.2.0-beta.3
  video_player: ^2.8.2
  chewie: ^1.7.5
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  local_auth: ^2.1.8
  flutter_local_notifications: ^17.0.0
  workmanager: ^0.9.0+3
  flutter_secure_storage: ^10.3.1
  cryptography: ^2.9.0
  qr_flutter: ^4.1.0
  file_picker: ^11.0.2
  gal: ^2.3.3
  permission_handler: ^11.3.1
  connectivity_plus: ^6.0.3
  google_fonts: ^6.2.1
  # ── Phase 0: SQLite persistence layer ────────────────────────
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.0
  uuid: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  flutter_launcher_icons: ^0.14.4
  # ── Phase 0: Drift code generation ────────────────────────────
  drift_dev: ^2.18.0
  build_runner: ^2.4.11

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/logo.png
  adaptive_icon_background: "#09080D"
  adaptive_icon_foreground: assets/images/logo.png
  min_sdk_android: 28

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
