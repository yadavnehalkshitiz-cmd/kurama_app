name: Flutter Build & Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'           # triggers on tags like v1.0.0, v1.2.3, etc.
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:   # manual trigger from GitHub UI

jobs:
  # ────────────────────────────────────────────────────────
  # 1. BUILD ANDROID APK (Ubuntu — faster & stable for Android)
  # ────────────────────────────────────────────────────────
  build_android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Validate Android release signing secrets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD
          do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Actions secret: ${name}"
              missing=1
            fi
          done
          exit "$missing"

      - name: Configure Android release signing
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: ./mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/kuramabot-release.jks
          printf '%s\n' \
            'storeFile=kuramabot-release.jks' \
            "storePassword=$ANDROID_KEYSTORE_PASSWORD" \
            "keyAlias=$ANDROID_KEY_ALIAS" \
            "keyPassword=$ANDROID_KEY_PASSWORD" \
            > key.properties

      - name: Get dependencies
        run: flutter pub get
        working-directory: ./mobile

      - name: Run Flutter tests
        run: flutter test
        working-directory: ./mobile

      - name: Analyze Flutter app
        run: flutter analyze --no-fatal-infos
        working-directory: ./mobile

      - name: Build Android APK
        run: flutter build apk --release --no-tree-shake-icons
        working-directory: ./mobile

      # Always save artifact (useful for non-release pushes)
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Kurama-App-Android-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Remove Android signing material
        if: always()
        shell: bash
        working-directory: ./mobile
        run: rm -f android/app/kuramabot-release.jks android/key.properties

  # ────────────────────────────────────────────────────────
  # 2. BUILD WINDOWS EXE
  # ────────────────────────────────────────────────────────
  build_windows:
    name: Build Windows Executable
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Desktop Support
        run: flutter config --enable-windows-desktop

      - name: Create Windows platform runner
        run: flutter create --platforms=windows .
        working-directory: ./mobile

      - name: Get dependencies
        run: flutter pub get
        working-directory: ./mobile

      - name: Build Windows Executable
        run: flutter build windows --release
        working-directory: ./mobile

      - name: Zip Windows build
        run: Compress-Archive -Path mobile/build/windows/x64/runner/Release/* -DestinationPath Kurama-App-Windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: Kurama-App-Windows-App
          path: Kurama-App-Windows.zip
          retention-days: 30

  # ────────────────────────────────────────────────────────
  # 3. PUBLISH GITHUB RELEASE (only on version tags: v*)
  # ────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build_android, build_windows]  # wait for both builds
    if: startsWith(github.ref, 'refs/tags/v')  # only runs on tags

    permissions:
      contents: write   # required to create releases

    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v8
        with:
          name: Kurama-App-Android-APK
          path: ./release

      - name: Download Windows App
        uses: actions/download-artifact@v8
        with:
          name: Kurama-App-Windows-App
          path: ./release

      - name: Rename APK with version
        run: mv ./release/app-release.apk ./release/Kurama-App-${{ github.ref_name }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: "🦊 Kurama App ${{ github.ref_name }}"
          body: |
            ## 🦊 Kurama App ${{ github.ref_name }}

            Privacy-focused multi-platform media downloader — download from YouTube, Instagram, TikTok, Twitter/X, Facebook, and 15+ more sites.

            ### 📥 Downloads
            | Platform | File |
            |---|---|
            | 📱 Android | `Kurama-App-${{ github.ref_name }}.apk` |
            | 💻 Windows | `Kurama-App-Windows.zip` |

            ### 📲 How to install on Android
            1. Download `Kurama-App-${{ github.ref_name }}.apk`
            2. On your phone, go to **Settings → Install unknown apps** and allow your browser/file manager
            3. Open the downloaded APK and tap **Install**

            > Phase 0 engineering build: public rollout waits for account-based authentication.
          files: |
            ./release/Kurama-App-${{ github.ref_name }}.apk
            ./release/Kurama-App-Windows.zip
          draft: false
          prerelease: false
